server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "billbook_up 1\n";
    }

    location = /metrics {
        default_type text/plain;
        return 200 "# HELP billbook_up Whether BILLBOOK is responding\n# TYPE billbook_up gauge\nbillbook_up 1\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
